# tmux settings for `nv`, which runs its own server (tmux -L nv) with this file,
# so any other tmux use keeps its own config. Tuned for Neovim inside tmux.

set -sg escape-time 10                  # Esc and Alt keys reach nvim without a delay
set -g focus-events on                  # nvim gets FocusGained, so changed files reload
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"     # true color for termguicolors
set -s extended-keys on                 # pass keys like Ctrl-Tab through to nvim
set -g history-limit 50000

set -g status-left "[nv #S] "
set -g status-left-length 60
set -g status-right "Ctrl-b d: detach (keeps running)"
